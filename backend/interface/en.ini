[ModelHelp]
DetModel = Detection model: decides how a text line is split into boxes,
    which directly affects where and how many spaces appear in the subtitle.
    · PP-OCRv6_medium_det: Best detection quality; splitting is conservative, so fewer spaces.
    · PP-OCRv6_small_det: Default. The small V6 tier; fastest.
    · PP-OCRv5_server_det: Splits most aggressively and produces the most spaces, closest to the older layout.
    · PP-OCRv5_mobile_det: Splits most coarsely and tends to merge a whole line into one box, producing the fewest spaces.
RecModel = Recognition model: decides accuracy and speed.
    If the selected model does not support the current subtitle language, the dedicated model for that language is used instead.
    · PP-OCRv6_medium_rec: Highest accuracy for Simplified and Traditional Chinese; largest size.
    · PP-OCRv6_small_rec: Default. Accuracy close to V5 server, but faster and much smaller.
    · PP-OCRv5_server_rec: The previous generation's large tier; sizeable.
    · PP-OCRv5_mobile_rec: Fastest and smallest, lowest accuracy.
FrameExtraction = Frame extraction: decides how frames containing subtitles are found.
    This affects total runtime but not recognition results.
    · Auto: use detection extraction when hardware acceleration is available, VideoSubFinder otherwise.
    · Detection: scan every frame with the detection model above. Fast with a GPU; extremely slow on CPU only, not recommended.
    · VideoSubFinder: call the bundled external tool, which detects subtitles from visual changes and needs no GPU.
